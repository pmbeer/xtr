[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitrix24-analytics-agent"
version = "1.0.0"
description = "Агент аналитики по личной работе в облачном Битрикс24: задачи, Открытые линии, CRM, звонки"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bitrix24", "analytics", "tasks", "openlines", "crm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = []

[project.scripts]
b24-agent = "bitrix24_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bitrix24_agent*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
