[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitrix24-agent"
version = "0.1.0"
description = "Агент для анализа личной продуктивности в Битрикс24: задачи и Открытые линии"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
]

[project.scripts]
bitrix24-agent = "bitrix24_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bitrix24_agent*"]
