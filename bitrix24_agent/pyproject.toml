[project]
name = "b24agent"
version = "1.0.0"
description = "Телеграм-агент аналитики по облачному Битрикс24"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DTZ", "PL"]
ignore = [
    "E501",    # длинные строки встречаются в русских сообщениях и запросах
    "PLR0913", # у сборщиков отчётов много именованных параметров осознанно
    "PLR2004", # магические числа в разборе периодов читаются лучше констант
    "RUF001",  # интерфейс и отчёты на русском: кириллица в строках — норма
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
