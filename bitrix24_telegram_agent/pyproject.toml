[project]
name = "bitrix24-telegram-agent"
version = "0.1.0"
description = "Telegram bot that exports personal Bitrix24 analytics to Excel"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
bitrix24-agent = "bitrix24_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitrix24_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
