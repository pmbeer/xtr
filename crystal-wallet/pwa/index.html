<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crystal Wallet">
  <meta name="theme-color" content="#141828">
  <title>Crystal Wallet</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="shield">🛡️</div>
      <h1>Crystal Wallet</h1>
      <p>Твой локальный кошелёк</p>
    </header>

    <main>
      <section class="balance-card coins">
        <div class="icon">💰</div>
        <div>
          <div class="label">Монеты</div>
          <div class="value" id="coins-value">0</div>
        </div>
      </section>

      <section class="balance-card crystals">
        <div class="icon">💎</div>
        <div>
          <div class="label">Кристаллы</div>
          <div class="value" id="crystals-value">0</div>
        </div>
      </section>

      <div class="actions">
        <button class="btn primary" id="open-editor">Задать баланс</button>
        <div class="row">
          <button class="btn secondary" data-add="1000">+1 000</button>
          <button class="btn secondary" data-add="100000">+100 000</button>
        </div>
        <button class="btn danger" id="reset-wallet">Сбросить</button>
      </div>
    </main>
  </div>

  <dialog id="editor-dialog">
    <form method="dialog" id="editor-form">
      <h2>Редактор баланса</h2>
      <p class="hint">Введи любое число от 0 до 9 999 999 999</p>

      <label>
        Монеты
        <input type="number" id="coins-input" min="0" max="9999999999" inputmode="numeric">
      </label>

      <label>
        Кристаллы
        <input type="number" id="crystals-input" min="0" max="9999999999" inputmode="numeric">
      </label>

      <div class="presets">
        <button type="button" class="preset" data-coins="1000" data-crystals="1000">1 000</button>
        <button type="button" class="preset" data-coins="100000" data-crystals="100000">100 000</button>
        <button type="button" class="preset" data-coins="1000000" data-crystals="1000000">1 000 000</button>
        <button type="button" class="preset" data-coins="9999999999" data-crystals="9999999999">Максимум</button>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn secondary" id="cancel-editor">Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
