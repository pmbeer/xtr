name: Build macOS Installer

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'dart-bet-predictor/**'
      - '.github/workflows/macos-installer.yml'
  pull_request:
    paths:
      - 'dart-bet-predictor/**'
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: macos-14
    defaults:
      run:
        working-directory: dart-bet-predictor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Show Swift version
        run: swift --version

      - name: Build app and DMG installer
        run: |
          chmod +x build-installer.sh scripts/*.sh
          ./build-installer.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartBetPredictor-macOS-Installer
          path: dart-bet-predictor/dist/*.dmg
          retention-days: 90
          if-no-files-found: error

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartBetPredictor-macOS-App
          path: dart-bet-predictor/build/DartBetPredictor.app
          retention-days: 30
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: DartBetPredictor-macOS-Installer
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dart-bet-predictor-v1.0.0
          name: Dart Bet Predictor v1.0.0 (macOS)
          body: |
            ## Dart Bet Predictor для macOS

            ### Установка
            1. Скачайте `DartBetPredictor-1.0.0-macOS.dmg`
            2. Откройте DMG и перетащите приложение в **Applications**
            3. При первом запуске: **Системные настройки → Конфиденциальность → Запись экрана** — разрешите доступ
            4. Если macOS блокирует запуск: ПКМ → **Открыть** → **Открыть**

            ### Требования
            - macOS 13 (Ventura) или новее
            - Mac с Apple Silicon или Intel
          files: dist/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
