name: Build DartPredictor macOS Installer

on:
  push:
    tags:
      - 'dart-predictor-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build DMG
        run: |
          cd DartPredictor
          chmod +x scripts/*.sh
          export ARCH="x86_64 arm64"
          export DMG_NAME="DartPredictor-1.0.4-macOS-Universal.dmg"
          ./scripts/build_dmg.sh

      - name: Verify build
        run: |
          ls -la DartPredictor/build/
          file DartPredictor/build/DartPredictor.app/Contents/MacOS/DartPredictor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartPredictor-macOS-Universal
          path: DartPredictor/build/DartPredictor-1.0.4-macOS-Universal.dmg
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dart-predictor-v1.0.4
          name: DartPredictor v1.0.4 — гибридный захват + мультимонитор + ИИ-пайплайн
          body: |
            ## DartPredictor v1.0.4 — программа видит и анализирует игру

            - **ScreenCaptureKit** (основной) + fallback RegionCapture
            - Выбор области на **всех мониторах**
            - **Превью сразу** после выбора области
            - ИИ: OCR (fast+accurate), таймер ставки, движения игрока, фаза броска
            - Автозапуск после разрешения «Запись экрана»
            - Прогноз комбинации TOP-4
          files: DartPredictor/build/DartPredictor-1.0.4-macOS-Universal.dmg
          draft: false
          prerelease: false
          generate_release_notes: false
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
