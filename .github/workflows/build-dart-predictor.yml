name: Build DartPredictor macOS Installer

on:
  push:
    tags:
      - 'dart-predictor-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build DMG
        run: |
          cd DartPredictor
          chmod +x scripts/*.sh
          export ARCH="x86_64 arm64"
          export DMG_NAME="DartPredictor-1.0.0-macOS-Universal.dmg"
          ./scripts/build_dmg.sh

      - name: Verify build
        run: |
          ls -la DartPredictor/build/
          file DartPredictor/build/DartPredictor.app/Contents/MacOS/DartPredictor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartPredictor-macOS-Universal
          path: DartPredictor/build/DartPredictor-1.0.0-macOS-Universal.dmg
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dart-predictor-v1.0.0
          name: DartPredictor v1.0.0 — ИИ-анализ экрана + комбинации
          body: |
            ## DartPredictor v1.0.0

            Нативное macOS-приложение для прогнозирования дартса с ИИ-анализом экрана.

            ### Установка
            1. Скачайте `DartPredictor-1.0.0-macOS-Universal.dmg`
            2. Откройте DMG и перетащите DartPredictor в Applications
            3. При первом запуске разрешите **Запись экрана** в Системных настройках

            ### Совместимость
            - macOS 14.0+
            - Intel x86_64 и Apple Silicon (Universal)
            - Оптимизировано для MacBook Pro 2018 (8 GB RAM)

            ### Возможности
            - Единая область мониторинга экрана
            - ИИ: поза, замах, бросок, результат
            - Прогноз комбинации TOP-4
            - Paper Prediction (без ставок)
          files: DartPredictor/build/DartPredictor-1.0.0-macOS-Universal.dmg
          draft: false
          prerelease: false
          generate_release_notes: false
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
