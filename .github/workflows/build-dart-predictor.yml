name: Build DartPredictor macOS Installer

on:
  push:
    tags:
      - 'dart-predictor-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#dart-predictor-v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            VERSION="1.0.9"
            TAG_NAME="dart-predictor-v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DMG_NAME=DartPredictor-${VERSION}-macOS-Universal.dmg" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION} (tag: ${TAG_NAME})"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build DMG
        run: |
          cd DartPredictor
          chmod +x scripts/*.sh
          export ARCH="x86_64 arm64"
          export DMG_NAME="${DMG_NAME}"
          ./scripts/build_dmg.sh

      - name: Verify build
        run: |
          ls -la DartPredictor/build/
          file "DartPredictor/build/${DMG_NAME}"
          test -f "DartPredictor/build/${DMG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DartPredictor-macOS-Universal-${{ env.VERSION }}
          path: DartPredictor/build/${{ env.DMG_NAME }}
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.TAG_NAME }}
          name: DartPredictor v${{ env.VERSION }}
          body: |
            ## DartPredictor v${{ env.VERSION }}

            Скачайте `DartPredictor-${{ env.VERSION }}-macOS-Universal.dmg` ниже.

            - Выбор окна Safari/fon.bet
            - Live online анализ (зоны: доска / игрок / результаты)
            - Прогноз TOP-4 комбинаций
          files: DartPredictor/build/${{ env.DMG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: false
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
