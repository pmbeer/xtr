[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitrix24-analytics-agent"
version = "1.0.0"
description = "Агент аналитики личной активности в облачном Bitrix24"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-httpx>=0.34.0"]

[project.scripts]
bitrix-agent = "bitrix_agent.cli:main"
bitrix-agent-web = "bitrix_agent.web.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bitrix_agent = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
