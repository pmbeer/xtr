[project]
name = "bitrix24-telegram-analytics"
version = "0.1.0"
description = "Telegram reports for personal Bitrix24 task and Open Line metrics"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.24.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["bitrix_analytics*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
