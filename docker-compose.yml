services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wink_clone
      MARIADB_USER: wink
      MARIADB_PASSWORD: wink
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "1"
      APP_TIMEZONE: Europe/Moscow
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: wink_clone
      DB_USERNAME: wink
      DB_PASSWORD: wink
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: wink
      PMA_PASSWORD: wink
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
